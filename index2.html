<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Gallery</title>
    <link rel="stylesheet" href="css/style2.css" />
    <script src="java/script2.js"></script>
  </head>
  <body>
    <div id="image">
      Hover your mouse or use the Tab key to select an image below.
    </div>

    <div class="gallery">
      <img
        class="preview"
        src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=500"
        alt="A Golden Retriever is holding a flower in its mouth."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=500"
        alt="A Pug with an adorable, funny expression."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=500"
        alt="A Beagle is smiling in a friendly way."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=500"
        alt="A Border Collie with a brown nose and one folded ear."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />

      <img
        class="preview"
        src="https://plus.unsplash.com/premium_photo-1668062459592-2c12d5c07ce8?q=80&w=1742&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="A brown-and-white Siberian Husky is lying down."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=500"
        alt="A French Bulldog wearing a yellow hoodie."
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      />
    </div>
  </body>
</html>
